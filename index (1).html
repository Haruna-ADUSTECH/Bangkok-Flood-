<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="สร้างรูปแจ้งว่าคุณปลอดภัยจากน้ำท่วมกรุงเทพฯ แล้วส่งให้ครอบครัวทาง LINE หรือ Facebook | Make a picture to tell family you're safe from the Bangkok flood.">
<meta property="og:title" content="ฉันปลอดภัยจากน้ำท่วม | I'm safe from the Bangkok flood">
<meta property="og:description" content="กรอกชื่อ รูป ที่อยู่ และเบอร์โทร แล้วบันทึกรูปไปแชร์ได้ทันที ไม่มีการอัปโหลดข้อมูล | Add your photo, address and phone, then save a picture to share. Nothing is uploaded.">
<meta property="og:type" content="website">
<title>สร้างรูปแจ้งสถานะน้ำท่วม | Flood Status Picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF2F4; --surface:#FFFFFF; --ink:#13232B; --muted:#55666D; --line:#CFD8DC;
  --safe:#17803D; --safe-bg:#E4F3E9; --danger:#C62828; --danger-bg:#FCEAEA;
  --th-red:#A51931; --th-white:#F4F5F8; --th-blue:#2D2A4A; --focus:#E0A100;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D171B; --surface:#152329; --ink:#E6EDEF; --muted:#A2B3B9; --line:#2A3E45;
    --safe:#43B96E; --safe-bg:#133222; --danger:#FF7A72; --danger-bg:#3A1716; --focus:#FFC940;
  }
}
:root[data-theme="dark"]{
  --bg:#0D171B; --surface:#152329; --ink:#E6EDEF; --muted:#A2B3B9; --line:#2A3E45;
  --safe:#43B96E; --safe-bg:#133222; --danger:#FF7A72; --danger-bg:#3A1716; --focus:#FFC940;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai Looped","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
  font-size:17px;line-height:1.6}
h1,h2{font-family:"Anuphan","Noto Sans Thai",system-ui,sans-serif;line-height:1.2;margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%}

.flagbar{display:grid;grid-template-rows:1fr 1fr 2fr 1fr 1fr;height:18px}
.flagbar i:nth-child(1),.flagbar i:nth-child(5){background:var(--th-red)}
.flagbar i:nth-child(2),.flagbar i:nth-child(4){background:var(--th-white)}
.flagbar i:nth-child(3){background:var(--th-blue)}

.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 0 8px}
.top h1{font-size:clamp(1.7rem,5vw,2.5rem)}
.top p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.lang button{border:0;background:transparent;padding:6px 14px;min-height:40px;cursor:pointer;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--th-blue);color:#fff}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:16px 0 48px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}

.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.status label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  border:2px solid var(--line);border-radius:16px;padding:14px 8px;cursor:pointer;font-weight:600;min-height:96px}
.status input{position:absolute;opacity:0;pointer-events:none}
.status .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.4rem;font-family:"Anuphan",sans-serif;font-weight:700}
.status .s .ico{background:var(--safe)}
.status .n .ico{background:var(--danger)}
.status label.s:has(input:checked){border-color:var(--safe);background:var(--safe-bg)}
.status label.n:has(input:checked){border-color:var(--danger);background:var(--danger-bg)}
.status label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.warn{background:var(--danger-bg);border-left:5px solid var(--danger);border-radius:10px;padding:10px 12px;margin:10px 0 0;font-weight:500}
.warn a{color:inherit;font-weight:700}

.field{margin-top:16px}
.field > label,.legend{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=tel],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);min-height:48px}
textarea{resize:vertical;min-height:84px}
.field.invalid input,.field.invalid textarea{border-color:var(--danger)}
.err{display:none;color:var(--danger);font-size:.92rem;margin-top:4px}
.field.invalid .err{display:block}
.photo-row{display:flex;gap:14px;align-items:center}
.thumb{width:76px;height:76px;border-radius:14px;background:var(--bg);border:2px dashed var(--line);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pick{display:inline-flex;align-items:center;border:1.5px solid var(--th-blue);border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:600}
:root:not([data-theme="light"]) .pick{border-color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.privacy{margin:18px 0 0;font-size:.92rem;color:var(--muted)}

.preview-col{position:sticky;top:calc(14px + env(safe-area-inset-top,0px))}
@media (max-width:820px){.preview-col{position:static}}
.preview{border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line);aspect-ratio:4/5}
.preview img{display:block;width:100%;height:100%;object-fit:contain}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.actions.one{grid-template-columns:1fr}
.btn{border:0;border-radius:14px;padding:14px;min-height:56px;cursor:pointer;font-family:"Anuphan",sans-serif;font-weight:700;font-size:1.15rem}
.btn-main{background:var(--th-blue);color:#fff}
:root:not([data-theme="light"]) .btn-main{background:#4A56A6}
.btn-alt{background:transparent;border:2px solid var(--th-blue);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:progress}
.hint{color:var(--muted);font-size:.92rem;margin:10px 0 0;text-align:center}
.msg{margin-top:10px;text-align:center;font-weight:600}
.msg.bad{color:var(--danger)} .msg.ok{color:var(--safe)}
</style>
</head>
<body>
<div class="flagbar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-t="title"></h1>
      <p data-t="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language / ภาษา">
      <button type="button" data-lang="th" aria-pressed="true">ไทย</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Details">
      <span class="legend" data-t="statusQ"></span>
      <div class="status" role="radiogroup">
        <label class="s"><input type="radio" name="status" value="safe" checked><span class="ico">✓</span><span data-t="safeOpt"></span></label>
        <label class="n"><input type="radio" name="status" value="help"><span class="ico">!</span><span data-t="helpOpt"></span></label>
      </div>
      <div class="warn" id="warn" hidden>
        <span data-t="warn"></span> <a href="tel:1669">1669</a> / <a href="tel:1784">1784</a>
      </div>

      <div class="field" id="f-photo">
        <span class="legend" data-t="photo"></span>
        <div class="photo-row">
          <div class="thumb" id="thumb" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          </div>
          <label for="photo" class="pick" id="pickLabel" data-t="photoBtn"></label>
          <input type="file" id="photo" accept="image/*" class="sr">
        </div>
        <div class="err" data-t="errPhoto"></div>
      </div>

      <div class="field" id="f-name">
        <label for="name" data-t="name"></label>
        <input type="text" id="name" maxlength="60" autocomplete="name">
        <div class="err" data-t="errName"></div>
      </div>

      <div class="field" id="f-address">
        <label for="address" data-t="address"></label>
        <textarea id="address" maxlength="140" autocomplete="street-address"></textarea>
        <div class="err" data-t="errAddress"></div>
      </div>

      <div class="field" id="f-phone">
        <label for="phone" data-t="phone"></label>
        <input type="tel" id="phone" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="081-234-5678">
        <div class="err" data-t="errPhone"></div>
      </div>

      <p class="privacy" data-t="privacy"></p>
    </section>

    <section class="preview-col" aria-label="Preview">
      <div class="preview"><img id="previewImg" alt=""></div>
      <div class="actions" id="actions">
        <button type="button" class="btn btn-main" id="saveBtn" data-t="save"></button>
        <button type="button" class="btn btn-alt" id="shareBtn" data-t="share" hidden></button>
      </div>
      <p class="hint" data-t="hint"></p>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </section>
  </div>
</div>

<canvas id="cv" width="1080" height="1350" hidden></canvas>

<script>
(function(){
"use strict";
const S={
 th:{title:"สร้างรูปแจ้งสถานะน้ำท่วม",
  sub:"กรอกข้อมูล แล้วบันทึกรูปไปส่งให้ครอบครัวและเพื่อนทาง LINE, Facebook หรือโซเชียลมีเดียอื่น",
  statusQ:"คุณปลอดภัยไหม", safeOpt:"ฉันปลอดภัย", helpOpt:"ไม่ปลอดภัย ต้องการความช่วยเหลือ",
  warn:"ถ้าอยู่ในอันตรายตอนนี้ โทรขอความช่วยเหลือก่อน แล้วค่อยส่งรูปนี้",
  photo:"รูปของคุณ", photoBtn:"เลือกรูปหรือถ่ายรูป", photoChange:"เปลี่ยนรูป", errPhoto:"ใช้รูปนี้ไม่ได้ ลองเลือกรูปอื่น",
  name:"ชื่อ-นามสกุล", errName:"กรุณากรอกชื่อ",
  address:"ที่อยู่ (เขต ซอย ถนน หรือจุดสังเกต)", errAddress:"กรุณากรอกที่อยู่",
  phone:"เบอร์โทรศัพท์", errPhone:"กรุณากรอกเบอร์โทรให้ครบ",
  privacy:"ข้อมูลและรูปของคุณอยู่ในเครื่องนี้เท่านั้น ไม่มีการอัปโหลดไปที่ใด",
  save:"บันทึกรูป JPG", share:"แชร์", saving:"กำลังสร้างรูป…",
  hint:"บนมือถือ กดค้างที่รูปเพื่อบันทึกได้เช่นกัน",
  saved:"บันทึกรูปแล้ว ส่งให้คนที่คุณรักได้เลย", fail:"บันทึกไม่สำเร็จ ลองกดค้างที่รูปเพื่อบันทึกแทน"},
 en:{title:"Make a flood status picture",
  sub:"Fill in your details, then save the picture and send it to family and friends on LINE, Facebook or other social media.",
  statusQ:"Are you safe?", safeOpt:"I'm safe", helpOpt:"Not safe, I need help",
  warn:"If you're in danger right now, call for help first, then send this picture.",
  photo:"Your photo", photoBtn:"Choose or take a photo", photoChange:"Change photo", errPhoto:"That photo can't be used. Try another one.",
  name:"Full name", errName:"Enter your name",
  address:"Address (district, soi, road or landmark)", errAddress:"Enter your address",
  phone:"Phone number", errPhone:"Enter your full phone number",
  privacy:"Your photo and details stay on this device. Nothing is uploaded.",
  save:"Save JPG", share:"Share", saving:"Making picture…",
  hint:"On a phone, you can also press and hold the picture to save it.",
  saved:"Picture saved. Send it to the people who care about you.", fail:"Couldn't save. Press and hold the picture to save it instead."}
};
let lang="th";
try{const v=localStorage.getItem("flood-card-lang"); if(v==="th"||v==="en") lang=v;}catch(e){}
const t=k=>S[lang][k];
const $=id=>document.getElementById(id);

let photoImg=null, jpgBlob=null, previewUrl=null, downloads=null;

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(n=>{const v=S[lang][n.dataset.t]; if(v) n.textContent=v;});
  if(photoImg) $("pickLabel").textContent=t("photoChange");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  $("previewImg").alt = lang==="th" ? "ตัวอย่างรูปที่จะบันทึก" : "Preview of the picture you'll save";
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.lang; try{localStorage.setItem("flood-card-lang",lang);}catch(e){} applyLang(); schedule();
}));

/* ---------- helpers ---------- */
const status=()=>document.querySelector('input[name=status]:checked').value;
function fmtPhone(raw){
  let d=String(raw||"").replace(/[^\d+]/g,"");
  if(d.startsWith("+66")) d="0"+d.slice(3);
  d=d.replace(/\D/g,"");
  if(d.length===10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  if(d.length===9) return `${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`;
  return String(raw||"").trim();
}
const digits=s=>String(s||"").replace(/\D/g,"").length;
const seg = (typeof Intl!=="undefined" && Intl.Segmenter) ? new Intl.Segmenter("th",{granularity:"word"}) : null;
function tokens(text){
  if(seg) return [...seg.segment(text)].map(s=>s.segment);
  return text.split(/(\s+)/);
}
function wrap(ctx,text,maxW,maxLines){
  const lines=[]; let cur="";
  for(const tk of tokens(text.replace(/\s+/g," ").trim())){
    const next=cur+tk;
    if(ctx.measureText(next).width<=maxW || !cur){ cur=next; }
    else { lines.push(cur.trim()); cur=tk.trimStart(); }
    // break very long unbreakable tokens
    while(ctx.measureText(cur).width>maxW && cur.length>1){
      let i=cur.length; while(i>1 && ctx.measureText(cur.slice(0,i)).width>maxW) i--;
      lines.push(cur.slice(0,i)); cur=cur.slice(i);
    }
  }
  if(cur.trim()) lines.push(cur.trim());
  if(lines.length>maxLines){
    const kept=lines.slice(0,maxLines); let last=kept[maxLines-1]+"…";
    while(ctx.measureText(last).width>maxW && last.length>1) last=last.slice(0,-2)+"…";
    kept[maxLines-1]=last; return kept;
  }
  return lines;
}
function fit(ctx,text,maxW,size,min,fontFn){
  let s=size; ctx.font=fontFn(s);
  while(ctx.measureText(text).width>maxW && s>min){ s-=2; ctx.font=fontFn(s); }
  return s;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
const HEAD=s=>`700 ${s}px Anuphan, "Noto Sans Thai", "Leelawadee UI", Thonburi, sans-serif`;
const BODY=(s,w=500)=>`${w} ${s}px "IBM Plex Sans Thai Looped", "Noto Sans Thai", "Leelawadee UI", Thonburi, sans-serif`;

/* ---------- drawing ---------- */
let fontsReady=null;
function loadFonts(){
  if(!fontsReady){
    fontsReady=Promise.all([
      document.fonts.load(HEAD(100),"ฉันปลอดภัย SAFE"),
      document.fonts.load(BODY(40,500),"ที่อยู่ Address"),
      document.fonts.load(BODY(40,600),"โทร 0812345678")
    ]).catch(()=>{});
  }
  return fontsReady;
}
async function draw(){
  await loadFonts();
  const cv=$("cv"), ctx=cv.getContext("2d"), W=1080, H=1350;
  const safe=status()==="safe";
  const accent=safe?"#17803D":"#C62828";
  const tint=safe?"#EEF7F1":"#FCEFEF";
  const name=$("name").value.trim(), address=$("address").value.trim(), phone=$("phone").value.trim();

  ctx.fillStyle=tint; ctx.fillRect(0,0,W,H);

  // Thai flag band: red, white, blue (double), white, red
  const fh=150, u=fh/6;
  [["#A51931",0,1],["#F4F5F8",1,1],["#2D2A4A",2,2],["#F4F5F8",4,1],["#A51931",5,1]].forEach(([c,a,n])=>{
    ctx.fillStyle=c; ctx.fillRect(0,a*u,W,n*u);
  });
  // Event label on the blue stripe
  ctx.fillStyle="#FFFFFF"; ctx.textAlign="center"; ctx.textBaseline="middle";
  const ev="น้ำท่วมกรุงเทพฯ   |   BANGKOK FLOOD";
  fit(ctx,ev,W-80,34,22,s=>BODY(s,600)); ctx.fillText(ev,W/2,3*u+2);
  ctx.textBaseline="alphabetic";

  // Status block
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,fh,W,10);
  const sy=fh+10, sh=216;
  ctx.fillStyle=accent; ctx.fillRect(0,sy,W,sh);
  const cx=150, cy=sy+sh/2;
  ctx.fillStyle="#FFFFFF"; ctx.beginPath(); ctx.arc(cx,cy,72,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=accent; ctx.lineWidth=16; ctx.lineCap="round"; ctx.lineJoin="round";
  if(safe){ ctx.beginPath(); ctx.moveTo(cx-34,cy+2); ctx.lineTo(cx-8,cy+28); ctx.lineTo(cx+36,cy-26); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(cx,cy-38); ctx.lineTo(cx,cy+10); ctx.stroke();
         ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(cx,cy+36,10,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle="#FFFFFF"; ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  const th=safe?"ฉันปลอดภัยจากน้ำท่วม":"ยังไม่ปลอดภัยจากน้ำท่วม", en=safe?"I'M SAFE FROM THE FLOOD":"NOT SAFE FROM THE FLOOD · NEED HELP";
  fit(ctx,th,W-290,96,56,HEAD); ctx.fillText(th,256,sy+118);
  fit(ctx,en,W-290,48,28,s=>BODY(s,600)); ctx.fillText(en,258,sy+180);

  // Photo
  const ps=436, px=(W-ps)/2, py=sy+sh+32;
  ctx.save(); roundRect(ctx,px,py,ps,ps,36); ctx.clip();
  if(photoImg){
    const iw=photoImg.naturalWidth, ih=photoImg.naturalHeight, sc=Math.max(ps/iw,ps/ih);
    const dw=iw*sc, dh=ih*sc; ctx.drawImage(photoImg,px+(ps-dw)/2,py+(ps-dh)/2,dw,dh);
  } else {
    ctx.fillStyle="#C9D3D7"; ctx.fillRect(px,py,ps,ps);
    ctx.fillStyle="#8A999F";
    ctx.beginPath(); ctx.arc(W/2,py+ps*0.38,ps*0.17,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W/2,py+ps*0.92,ps*0.33,ps*0.3,0,Math.PI,0); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle=accent; ctx.lineWidth=12; roundRect(ctx,px,py,ps,ps,36); ctx.stroke();

  // Name
  ctx.textAlign="center"; ctx.fillStyle="#13232B";
  let y=py+ps+86;
  const nm=name||(lang==="th"?"ชื่อของคุณ":"Your name");
  ctx.globalAlpha=name?1:.35;
  fit(ctx,nm,W-120,68,40,HEAD); ctx.fillText(nm,W/2,y);
  ctx.globalAlpha=1;

  // Address
  y+=58;
  ctx.fillStyle="#55666D"; ctx.font=BODY(28,500); ctx.fillText("ที่อยู่  Address",W/2,y);
  ctx.fillStyle="#13232B"; ctx.font=BODY(38,500);
  const ad=address||(lang==="th"?"ที่อยู่ของคุณ":"Your address");
  ctx.globalAlpha=address?1:.35;
  const lines=wrap(ctx,ad,W-140,2);
  lines.forEach((l,i)=>ctx.fillText(l,W/2,y+50+i*50));
  ctx.globalAlpha=1;
  y+=50+lines.length*50+14;

  // Phone
  ctx.fillStyle="#55666D"; ctx.font=BODY(28,500); ctx.fillText("โทร  Phone",W/2,y);
  const ph=phone?fmtPhone(phone):"0XX-XXX-XXXX";
  ctx.fillStyle=phone?accent:"rgba(19,35,43,.35)";
  fit(ctx,ph,W-160,62,40,HEAD); ctx.fillText(ph,W/2,y+66);

  // Footer
  const fy=H-110;
  ctx.fillStyle="#2D2A4A"; ctx.fillRect(0,fy,W,110);
  ctx.fillStyle="#FFFFFF";
  const now=new Date();
  const thDate=new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(now);
  const enDate=new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(now);
  ctx.font=BODY(26,500); fit(ctx,`อัปเดต ${thDate}  |  Updated ${enDate}`,W-80,26,18,s=>BODY(s,500));
  ctx.fillText(`อัปเดต ${thDate}  |  Updated ${enDate}`,W/2,fy+42);
  const sos="ฉุกเฉิน Emergency  1669   ปภ. 1784   กทม. 1555";
  fit(ctx,sos,W-80,32,20,s=>BODY(s,600)); ctx.fillText(sos,W/2,fy+86);

  return new Promise(res=>cv.toBlob(b=>res(b),"image/jpeg",0.92));
}

let drawTimer=null, drawing=Promise.resolve();
function schedule(){
  clearTimeout(drawTimer);
  drawTimer=setTimeout(()=>{ drawing=refresh(); },150);
}
async function refresh(){
  const b=await draw();
  if(!b) return;
  jpgBlob=b;
  const url=URL.createObjectURL(b);
  $("previewImg").src=url;
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl=url;
}

/* ---------- inputs ---------- */
document.querySelectorAll('input[name=status]').forEach(r=>r.addEventListener("change",()=>{
  $("warn").hidden = status()==="safe"; schedule();
}));
["name","address","phone"].forEach(id=>$(id).addEventListener("input",()=>{ $("f-"+id).classList.remove("invalid"); $("msg").textContent=""; schedule(); }));
$("photo").addEventListener("change",e=>{
  const file=e.target.files&&e.target.files[0]; $("f-photo").classList.remove("invalid");
  if(!file) return;
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
    photoImg=img;
    $("thumb").replaceChildren(Object.assign(document.createElement("img"),{src:url,alt:""}));
    $("pickLabel").textContent=t("photoChange");
    schedule();
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); $("f-photo").classList.add("invalid"); };
  img.src=url;
});

function validate(){
  const bad=[];
  if(!$("name").value.trim()) bad.push("name");
  if(!$("address").value.trim()) bad.push("address");
  if(digits($("phone").value)<9) bad.push("phone");
  ["name","address","phone"].forEach(id=>$("f-"+id).classList.toggle("invalid",bad.includes(id)));
  if(bad.length){ $(bad[0]).focus(); return false; }
  return true;
}
function fileName(){
  const n=new Date(), d=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
  return `${status()==="safe"?"im-safe":"need-help"}-${d}.jpg`;
}
function setMsg(kind,key){ const m=$("msg"); m.className="msg "+(kind||""); m.textContent=key?t(key):""; }

async function withFreshJpg(fn){
  if(!validate()) return;
  clearTimeout(drawTimer);
  const btns=[$("saveBtn"),$("shareBtn")]; btns.forEach(b=>b.disabled=true);
  const label=$("saveBtn").textContent; $("saveBtn").textContent=t("saving");
  try{ await refresh(); await fn(jpgBlob); }
  finally{ btns.forEach(b=>b.disabled=false); $("saveBtn").textContent=t("save"); }
}

$("saveBtn").addEventListener("click",()=>withFreshJpg(async blob=>{
  setMsg("","");
  if(downloads){
    try{ await downloads.save({filename:fileName(),data:blob}); setMsg("ok","saved"); }
    catch(e){ if(e&&e.code!=="declined") setMsg("bad","fail"); }
    return;
  }
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    setMsg("ok","saved");
  }catch(e){ setMsg("bad","fail"); }
}));

$("shareBtn").addEventListener("click",()=>withFreshJpg(async blob=>{
  const file=new File([blob],fileName(),{type:"image/jpeg"});
  const name=$("name").value.trim();
  const text = status()==="safe" ? `ฉันปลอดภัย / I'm safe – ${name}` : `ต้องการความช่วยเหลือ / I need help – ${name}`;
  try{ await navigator.share({files:[file],text}); }
  catch(e){ if(e&&e.name!=="AbortError") setMsg("bad","fail"); }
}));

// Show Share only where the phone can share image files
try{
  const probe=new File([new Blob(["x"],{type:"image/jpeg"})],"x.jpg",{type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[probe]})) $("shareBtn").hidden=false;
}catch(e){}
if($("shareBtn").hidden) $("actions").classList.add("one");

// Inside claude.ai the page saves through the viewer's download prompt
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("downloads").then(d=>{ downloads=d; }).catch(()=>{});
}

applyLang();
schedule();
})();
</script>
</body>
</html>
